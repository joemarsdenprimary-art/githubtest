<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* ...existing styles... */
    </style>
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script>
      function createActivityCard(activity, name) {
        return `
                <div class="activity-card">
                    <h2>${name}</h2>
                    <p class="activity-desc">${activity.description}</p>
                    <p class="activity-schedule"><strong>Schedule:</strong> ${activity.schedule}</p>
                    <p class="activity-spots"><strong>Available Spots:</strong> ${activity.max_participants - activity.participants.length} / ${activity.max_participants}</p>

                    <div class="participants-section">
                        <p class="participants-header">Current Participants</p>
                        <ul class="participants-list">
                            ${activity.participants.length ? activity.participants.map(email => `<li>${email}</li>`).join('') : `<li class="no-participants">No participants yet</li>`}
                        </ul>
                    </div>
                </div>
            `;
      }

      // ...existing code...
    </script>

    <script src="app.js"></script>
  </body>
</html>
